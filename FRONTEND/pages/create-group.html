<!-- pages/create-group.html -->
<div class="modal-overlay" id="create-group-modal">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Создать новую группу</h3>
            <button class="modal-close" id="close-group-modal">✕</button>
        </div>
        
        <div class="modal-body">
            <div class="form-group">
                <label for="group-name">Название группы</label>
                <input type="text" id="group-name" placeholder="Например: Отдел разработки" class="form-input" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>Выберите участников (минимум 1)</label>
                <div class="search-contacts">
                    <input type="text" id="contact-search" placeholder="Поиск по имени или email..." class="form-input">
                </div>
                
                <div class="contacts-list" id="contacts-list">
                    <div style="padding: 20px; text-align: center; color: #a0a8b4;">Загрузка контактов...</div>
                </div>
                
                <div class="selected-contacts" id="selected-contacts">
                    <div class="selected-title">Выбрано: <span id="selected-count">0</span></div>
                    <div class="selected-tags" id="selected-tags">
                        <span style="color: #a0a8b4; font-size: 0.8rem;">Никто не выбран</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="btn-secondary" id="cancel-group">Отмена</button>
            <button class="btn-primary" id="create-group-submit" disabled>Создать группу</button>
        </div>      
    </div>
</div>
