<div class="chat-container">
    <div class="sidebar">
        <div class="user-info">
            <div class="avatar-wrapper" id="avatar-wrapper" style="cursor: pointer;">
                <img src="images/default-avatar.png" alt="avatar" class="avatar" id="chat-avatar">
            </div>
            <span id="user-email">user@company.com</span>
        </div>

        <!-- КНОПКА СОЗДАНИЯ ГРУППЫ -->
        <button id="create-group-btn" class="create-group-btn">
            <span>👥</span> Создать группу
        </button>

        <!-- ПОИСК ПО СООБЩЕНИЯМ -->
        <div class="search-section">
            <div class="search-input-wrapper">
                <input type="text" id="search-input" placeholder="Поиск по сообщениям...">
                <button id="search-btn" class="search-btn">🔍</button>
            </div>
        </div>

        <!-- ПАНЕЛЬ РЕЗУЛЬТАТОВ ПОИСКА -->
        <div class="search-results-panel" id="search-results-panel" style="display: none;">
            <div class="search-results-header">
                <span id="search-results-title">Результаты поиска</span>
                <button id="close-search-results" class="close-search-btn">✕</button>
            </div>
            <div class="search-results-list" id="search-results-list">
                <!-- Сюда будут добавляться результаты -->
            </div>
        </div>

        <!-- СПИСОК ЧАТОВ - ПОЛНОСТЬЮ ПУСТОЙ! -->
        <div class="chats-list" id="chats-list">
            <!-- Чаты будут созданы через JavaScript -->
        </div>

        <button id="logout-btn" class="logout">Выйти</button>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages">
            <!-- Сообщения добавляются через JavaScript -->
        </div>
        
        <div class="message-input">
            <button id="attach-btn" class="attach-btn" title="Прикрепить файл">
                <span>📎</span>
            </button>
            <input type="file" id="file-upload" style="display: none;" multiple>
            
            <input type="text" id="message-field" placeholder="Написать сообщение...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>
</div>
