<div class="chat-container">

    <div class="sidebar">
        <div class="user-info">
            <div class="avatar-wrapper" id="avatar-wrapper" style="cursor: pointer;">
                <img src="images/default-avatar.png" alt="avatar" class="avatar" id="chat-avatar">
            </div>
            <span id="user-email">user@company.com</span>
        </div>

        <div class="chats-list">
            <div class="chat-item active">Лучший коллега</div>
            <div class="chat-item">Команда ы</div>
            <div class="chat-item">Проект по захвату мира</div>
        </div>

        <button id="logout-btn" class="logout">Выйти</button>
    </div>

    
    <div class="chat-area">
        <!-- Контейнер для сообщений - пустой, сообщения добавляются через JS -->
        <div class="messages" id="messages">
            <!-- Сообщения будут добавляться сюда через JavaScript -->
        </div>
        
        <div class="message-input">
            <input type="text" id="message-field" placeholder="Написать сообщение...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

</div>
