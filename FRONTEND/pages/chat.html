<!-- pages/chat.html -->
<div class="chat-container">
    <div class="sidebar">
        <div class="user-info">
            <div class="avatar-wrapper" id="avatar-wrapper" style="cursor: pointer;">
                <img src="images/default-avatar.png" alt="avatar" class="avatar" id="chat-avatar">
            </div>
            <span id="user-email"></span>
        </div>

        <div class="search-section">
            <div class="search-input-wrapper">
                <input type="text" id="search-input" placeholder="Поиск по сообщениям...">
                <button id="search-btn" class="search-btn">🔍</button>
            </div>
        </div>

        <div class="search-results-panel" id="search-results-panel" style="display: none;">
            <div class="search-results-header">
                <span id="search-results-title">Результаты поиска</span>
                <button id="close-search-results" class="close-search-btn">✕</button>
            </div>
            <div class="search-results-list" id="search-results-list"></div>
        </div>

        <div class="chats-list" id="chats-list"></div>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages"></div>
        
        <div class="message-input">
            <button id="attach-btn" class="attach-btn" title="Прикрепить файл">
                <span>📎</span>
            </button>
            <input type="file" id="file-upload" style="display: none;" multiple>
            
            <!-- ЗАМЕНА: input на textarea -->
            <textarea id="message-field" rows="1" placeholder="Написать сообщение..."></textarea>

            <button id="emoji-btn" class="emoji-btn" title="Эмодзи">
                <span>😊</span>
            </button>
    
            <div id="emoji-panel" class="emoji-panel" style="display: none;">
                <div class="emoji-categories">
                    <button class="emoji-category active" data-category="recent">🕒</button>
                    <button class="emoji-category" data-category="smileys">😊</button>
                    <button class="emoji-category" data-category="people">👋</button>
                    <button class="emoji-category" data-category="animals">🐻</button>
                    <button class="emoji-category" data-category="food">🍔</button>
                    <button class="emoji-category" data-category="activities">⚽</button>
                    <button class="emoji-category" data-category="travel">🚗</button>
                    <button class="emoji-category" data-category="objects">💡</button>
                    <button class="emoji-category" data-category="symbols">❤️</button>
                    <button class="emoji-category" data-category="flags">🏁</button>
                </div>
                <div class="emoji-container" id="emoji-container"></div>
            </div>
            <button id="send-btn">Отправить</button>
        </div>
    </div>
</div>

<style>
/* Стили для textarea */
#message-field {
    flex: 1;
    padding: 12px 20px;
    background: var(--gradient-input);
    border: 1px solid var(--border-light);
    border-radius: 28px;
    color: var(--text-primary);
    font-size: 1rem;
    outline: none;
    transition: all 0.2s;
    resize: none;
    font-family: inherit;
    line-height: 1.4;
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: none; /* Firefox - скрываем ползунок */
    -ms-overflow-style: none; /* IE/Edge - скрываем ползунок */
}

#message-field::-webkit-scrollbar {
    display: none; /* Chrome/Safari/Opera - скрываем ползунок */
}

#message-field:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
}

.chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chat-bg, #1e242b);
    height: 100%;
}

.placeholder-content {
    text-align: center;
    color: #a0a8b4;
}

.placeholder-icon {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
    opacity: 0.5;
}

.placeholder-content h3 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #e0e0e0;
}

.placeholder-content p {
    font-size: 14px;
    color: #a0a8b4;
}

#messages {
    display: none;
}

.message-input {
    display: none;
}

.chat-selected #messages,
.chat-selected .message-input {
    display: flex;
}
</style>
