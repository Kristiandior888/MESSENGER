<!-- pages/login-verify.html -->
<div class="login-container">
    <h1>Подтверждение</h1>
    <p>Код отправлен на <strong id="verify-email"></strong></p>
    <p>Введите код из письма</p>
    
    <input type="text" id="verify-code" placeholder="Код подтверждения" class="login-input" maxlength="6">
    <button id="verify-code-btn" class="login-btn">Войти</button>
    <button id="back-to-email-btn" class="login-btn-secondary">Назад</button>
    
    <div id="verify-error" class="login-error-message" style="display: none;"></div>
</div>
